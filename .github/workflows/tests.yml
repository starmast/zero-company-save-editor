name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The editor is cross-platform (Windows, Linux, macOS), so every change is built and tested on all three.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build ZeroCompany.sln -c Release
      - name: Test
        # Tests that need a real save, extracted game data or the game install skip themselves in CI
        # (those files are never committed); the synthetic GVAS tests, database tests and UI smoke tests run.
        run: dotnet test ZeroCompany.sln -c Release --no-build -- RunConfiguration.TestSessionTimeout=900000
