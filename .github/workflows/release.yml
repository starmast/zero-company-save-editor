name: release

# Publishes a self-contained single-file build per platform when a version tag is pushed (e.g. v0.4.0).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, archive: zip }
          - { os: ubuntu-latest, rid: linux-x64, archive: tar.gz }
          - { os: macos-latest, rid: osx-arm64, archive: tar.gz }
          - { os: macos-13, rid: osx-x64, archive: tar.gz }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test
        run: dotnet test ZeroCompany.sln -c Release
      - name: Publish
        shell: bash
        run: >
          dotnet publish src/ZeroCompany.App -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -o publish/ZeroCompanyEditor-${{ github.ref_name }}-${{ matrix.rid }}
      - name: Package
        shell: bash
        run: |
          name="ZeroCompanyEditor-${{ github.ref_name }}-${{ matrix.rid }}"
          cp README.md LICENSE DISCLAIMER.md "publish/$name/"
          cd publish
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "../$name.zip" "$name" > /dev/null
          else
            tar -czf "../$name.tar.gz" "$name"
          fi
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" > /dev/null 2>&1 || gh release create "${{ github.ref_name }}" --generate-notes
          gh release upload "${{ github.ref_name }}" ZeroCompanyEditor-${{ github.ref_name }}-${{ matrix.rid }}.* --clobber
