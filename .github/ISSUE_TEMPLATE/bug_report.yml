name: Bug report
description: Something in the editor does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The quickest way to send the details: press **Copy debug report** on the red error banner (or
        **Game data > Report a problem**) and paste it below. From the command line, `zc doctor --report --save <save>` prints the same.

        If the problem needs your save itself, use **Save debug bundle…** and attach the zip it makes (the report, the save and the
        crash log). Please do **not** attach game files, extracted game data (`gamedata/`) or `.usmap` mapping files.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where in the app?
      options:
        - Saves / opening a save
        - Command
        - Personnel
        - Armory
        - Upgrades
        - Medbay
        - Galaxy
        - Combat
        - Advanced
        - Game data / extraction
        - zc (command line)
        - Installing / starting the app
        - Other
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Debug report
      description: Paste the text from Copy debug report (it has the editor and game versions, the error and its details).
      render: text
  - type: input
    id: version
    attributes:
      label: Editor version
      description: Only if you could not paste a debug report. Shown in the debug report and in the release you downloaded.
      placeholder: "1.0.0"
